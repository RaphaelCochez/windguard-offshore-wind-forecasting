name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: borssele-digital-twin/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: pip install -r requirements.txt
      - name: Run unit & service tests
        run: python -m unittest discover -s tests -v

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: borssele-digital-twin/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: borssele-digital-twin/frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm install
      - name: Build production bundle
        run: npm run build
